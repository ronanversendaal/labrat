[package]
name = "labrat"
version = "0.1.0"
description = "LabRat - A GitLab MR Review App"
authors = ["you"]
edition = "2021"
default-run = "LabRat"

[[bin]]
name = "LabRat"
path = "src/main.rs"

[lib]
name = "labrat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Secure credential storage
keyring = { version = "3", features = ["apple-native"] }

# Syntax highlighting
syntect = "5"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
which = "7"
base64 = "0.22"

# Web server (optional, for browser/Playwright support)
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[features]
default = []
web-server = ["axum", "tower-http"]

[[bin]]
name = "labrat-web"
path = "src/bin/web_server.rs"
required-features = ["web-server"]

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
